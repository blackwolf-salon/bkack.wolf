<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صالون بلاك ولف - حجز المواعيد</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --primary: #d4af37;
      --text: #ffffff;
      --text-muted: #aaaaaa;
      --border: #333333;
      --danger: #e74c3c;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
    }

    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 20px;
      font-size: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--text-muted);
      font-size: 14px;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: #2a2a2a;
      color: var(--text);
      font-size: 16px;
      box-sizing: border-box;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }

    button {
      background-color: var(--primary);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .appointments-list {
      margin-top: 30px;
    }

    .appointment-card {
      background-color: #282828;
      border-right: 4px solid var(--primary);
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .appointment-info h3 {
      margin: 0 0 4px 0;
      font-size: 16px;
      color: var(--text);
    }

    .appointment-info p {
      margin: 0;
      font-size: 13px;
      color: var(--text-muted);
    }

    .delete-btn {
      background-color: transparent;
      color: var(--danger);
      border: none;
      width: auto;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 18px;
    }
  </style>

  <!-- Firebase App & Firestore SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="container">
  <h1>صالون بلاك ولف (عامودة)</h1>

  <form id="bookingForm">
    <div class="form-group">
      <label for="clientName">اسم الزبون:</label>
      <input type="text" id="clientName" required placeholder="أدخل الاسم الثلاثي">
    </div>

    <div class="form-group">
      <label for="serviceType">نوع الخدمة:</label>
      <select id="serviceType">
        <option value="حلاقة شعر">حلاقة شعر</option>
        <option value="حلاقة ذقن">حلاقة ذقن</option>
        <option value="شعر وذقن">شعر وذقن</option>
        <option value="تنظيف بشرة">تنظيف بشرة</option>
        <option value="خدمة كاملة VIP">خدمة كاملة VIP</option>
      </select>
    </div>

    <div class="form-group">
      <label for="bookingDate">التاريخ:</label>
      <input type="date" id="bookingDate" required>
    </div>

    <div class="form-group">
      <label for="bookingTime">الوقت:</label>
      <input type="time" id="bookingTime" required>
    </div>

    <button type="submit">تأكيد الحجز</button>
  </form>

  <div class="appointments-list">
    <h2>المواعيد المحجوزة</h2>
    <div id="appointmentsContainer">
      <p style="text-align: center; color: var(--text-muted);">جاري تحميل المواعيد...</p>
    </div>
  </div>
</div>
